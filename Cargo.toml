[package]
name = "openpgp-card-tool-git"
description = "A simple tool for Git signing and verification with a focus on OpenPGP cards"
version = "0.1.7"
authors = ["Wiktor Kwapisiewicz <wiktor@metacode.biz>", "Heiko Schaefer <heiko@schaefer.name>"]
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://codeberg.org/openpgp-card/oct-git"

[[bin]]
name = "oct-git"

[dependencies]
card-backend-pcsc = "0.5"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
hex = "0.4"
log = "0.4"
notify-rust = { version = "4", optional = true }
openpgp-card = "0.5"
openpgp-card-rpgp = "0.4"
openpgp-card-state = "0.4.0"
pgp = "0.16"
rpassword = "7"
rpgpie = "0.6.6"
rpgpie-certificate-store = "0.3.1"

[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

[dev-dependencies]
openpgp-cert-d = "0.3"
rstest = "0.19"
testdir = "0.9"
testresult = "0.4"

[features]
default = ["notify"]
notify = ["dep:notify-rust"]
