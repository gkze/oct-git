[package]
name = "openpgp-card-tool-git"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oct-git"

[dependencies]
card-backend-pcsc = "0.5"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
hex = "0.4"
log = "0.4"
notify-rust = { version = "4", optional = true }
openpgp-card = "0.5.0-alpha.1"
openpgp-card-rpgp = "0.0.3"
openpgp-card-state = "0.2"
pgp = "0.12.0-alpha.2"
reqwest = { version = "0.12", features = ["blocking"] }
rpassword = "7"
rpgpie = "0.0.6"
rpgpie-certificate-store = "0.0.4"

[dev-dependencies]
openpgp-cert-d = "0.3"
rstest = "0.19"
testdir = "0.9"
testresult = "0.4"

[features]
default = ["notify"]
notify = ["dep:notify-rust"]
